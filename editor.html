<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <link rel="stylesheet" href="css/editor.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
   <title>Editor</title>
</head>
<body>
  
   <div class="barra_superior">

        <h1 class="titulo">
            <i class="fa-solid fa-database" aria-hidden="true"></i>
            Diagramador <b>ER</b>
        </h1>
       <h3 class="sub_titulo">Desenhe seu banco de dados de forma visual.</h3>


       <button type="button" class="b_inicio" onclick="window.location.href='index.html'"><i class="fa-solid fa-house"></i>Início</button>
       <button type="button" class="gerar_sql"><i class="fa-solid fa-code"></i>Gerar SQL</button>
       <button type="button" class="b_configuracoes"><i class="fa-solid fa-gear"></i></button>
   </div>


   <div class="barra_esquerda">
       <div class="ferramentas">
           <p class="t_principal_1">Ferramentas</p>
           <button type="button" class="ad_tabelas"><i class="fa-solid fa-plus"></i>Adicionar Tabelas</button>


           <div class="relacoes">
               <button type= "button" class="relacao_1p1"><i class="fa-solid fa-square" id="cor1_1"></i>Relação 1:1</button>
               <button type="button"  class="relacao_1pN"><i class="fa-solid fa-square" id="cor1_N"></i>Relação 1:N</button>
               <button type="button" class="relacao_NpM"><i class="fa-solid fa-square" id="corN_N"></i>Relação N:N</button>
           </div>
       </div>
      
       <div class="acoes">
           <p class="t_principal_2">Ações</p>
           <div class="b_acoes">
               <button type="button" class="selecionar"><i class="fa-solid fa-mouse-pointer" id="iconEsquerda"></i>Selecionar</button>
               <button type="button" class="mover"><i class="fa-solid fa-up-down-left-right" id="iconEsquerda"></i>Mover</button>
               <button type="button" class="excluir"><i class="fa-solid fa-trash-can" id="iconEsquerda"></i>Excluir</button>
           </div>
       </div>


       <div class="dica">
            <h3>Dica</h3>
           <p>Arraste as tabelas pela tela e conecte os campos para criar relações. Depois clique em "Gerar SQL" para obter o script</p>
       </div>
   </div>


   <div class="barra_direita">
       <p class="t_principal_2">Script SQL</p>
       <div class="campo_script">
           <button type="button" class="botao_copiar">Copiar</button>

       </div>
   </div>

   <div class="mesa"></div>

    </div>

    <script src="js/armazenamento.js"></script>
    <script src="js/relacionamentos.js"></script>
    <script src="js/tabelas.js"></script>
    <script src="js/gerador-sql.js"></script>
    <script src="js/exportacao.js"></script>


</body>
</html>
